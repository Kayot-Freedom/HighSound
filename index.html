<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>High Sound — Автозвук и чип-тюнинг</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #050505;
    --bg-soft: #0f0f0f;
    --card: #141414;
    --card-hover: #1c1c1c;
    --border: #2a2a2a;
    --accent: #ffffff;
    --accent-2: #b0b0b0;
    --accent-glow: rgba(255, 255, 255, 0.18);
    --text: #f0f0f0;
    --text-dim: #8a8a8a;
    --ok: #d0d0d0;
    --warn: #b0b0b0;
    --danger: #909090;
  }

  body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255, 255, 255, 0.06) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 100%, rgba(255, 255, 255, 0.04) 0%, transparent 45%);
    z-index: -1;
    animation: bgPulse 8s ease-in-out infinite alternate;
  }

  @keyframes bgPulse {
    0% { opacity: 0.6; }
    100% { opacity: 1; }
  }

  /* Навигация */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 40px;
    background: rgba(5, 5, 5, 0.85);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .logo-img {
    width: 42px; height: 42px;
    border-radius: 11px;
    object-fit: cover;
    box-shadow: 0 0 22px var(--accent-glow);
    background: #fff;
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  .logo-text .name {
    font-size: 1.15em;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffffff, #808080);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .logo-text .tagline {
    font-size: 0.65em;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 3px;
  }

  nav ul { display: flex; gap: 26px; list-style: none; }
  nav a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.9em;
    transition: color 0.2s;
    cursor: pointer;
  }
  nav a:hover, nav a.active { color: var(--accent); }

  .container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ===== HERO ===== */
  .hero {
    text-align: center;
    padding: 70px 20px 40px;
    position: relative;
  }

  .equalizer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 5px;
    height: 50px;
    margin-bottom: 28px;
  }

  .equalizer .bar {
    width: 5px;
    background: linear-gradient(to top, #ffffff, #606060);
    border-radius: 3px;
    animation: eqBounce 1.2s ease-in-out infinite;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
  }

  .equalizer .bar:nth-child(1) { height: 30%; animation-delay: 0s; }
  .equalizer .bar:nth-child(2) { height: 60%; animation-delay: 0.1s; }
  .equalizer .bar:nth-child(3) { height: 40%; animation-delay: 0.2s; }
  .equalizer .bar:nth-child(4) { height: 80%; animation-delay: 0.3s; }
  .equalizer .bar:nth-child(5) { height: 50%; animation-delay: 0.4s; }
  .equalizer .bar:nth-child(6) { height: 90%; animation-delay: 0.5s; }
  .equalizer .bar:nth-child(7) { height: 35%; animation-delay: 0.6s; }
  .equalizer .bar:nth-child(8) { height: 70%; animation-delay: 0.7s; }
  .equalizer .bar:nth-child(9) { height: 45%; animation-delay: 0.8s; }

  @keyframes eqBounce {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 18px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50px;
    font-size: 0.8em;
    color: var(--text);
    margin-bottom: 22px;
    letter-spacing: 0.5px;
  }

  .badge .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px #fff;
    animation: pulse 1.8s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .hero h1 {
    font-size: clamp(2em, 5vw, 3.2em);
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -1px;
    margin-bottom: 18px;
  }

  .hero h1 .grad {
    background: linear-gradient(135deg, #ffffff, #808080);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero-sub {
    display: block;
    color: var(--text-dim);
    font-size: 1.05em;
    max-width: 620px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* ===== ПОИСК ===== */
  .search-box {
    max-width: 560px;
    margin: 32px auto 0;
    display: flex;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08);
  }

  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 0.95em;
    padding: 12px 16px;
    font-family: inherit;
  }

  .search-box input::placeholder { color: #4a4a4a; }

  .search-box button {
    padding: 12px 22px;
    background: linear-gradient(135deg, #ffffff, #b0b0b0);
    border: none;
    border-radius: 10px;
    color: #000;
    font-weight: 700;
    font-size: 0.9em;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }

  .search-box button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(255, 255, 255, 0.18);
  }

  /* ===== ГЛАВНЫЕ ТАБЫ ===== */
  .main-tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 40px auto 0;
    padding: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: fit-content;
    flex-wrap: wrap;
  }

  .main-tab {
    padding: 11px 24px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 0.9em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .main-tab.active {
    background: linear-gradient(135deg, #ffffff, #b0b0b0);
    color: #000;
    box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
  }

  .main-tab:not(.active):hover { color: var(--text); }

  /* ===== ПАНЕЛИ ===== */
  .panel { display: none; animation: fadeUp 0.4s ease; }
  .panel.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== КАРТОЧКИ УСЛУГ ===== */
  .services {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    margin: 20px 0 60px;
  }

  .service {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    display: flex;
    flex-direction: column;
  }

  .service:hover {
    transform: translateY(-5px);
    border-color: rgba(255, 255, 255, 0.4);
    box-shadow: 0 12px 32px rgba(255, 255, 255, 0.08);
  }

  .service-head {
    height: 160px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.04));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.4em;
    position: relative;
    overflow: hidden;
  }

  .service-head::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 3px;
    background: linear-gradient(90deg, #ffffff, #808080);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s;
  }

  .service:hover .service-head::after { transform: scaleX(1); }

  .service-body {
    padding: 22px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .service-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 5px;
    font-size: 0.72em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    width: fit-content;
    background: rgba(255, 255, 255, 0.10);
    color: #fff;
  }

  .service h3 {
    font-size: 1.15em;
    font-weight: 700;
    margin-bottom: 10px;
    line-height: 1.3;
  }

  .service .desc {
    font-size: 0.88em;
    color: var(--text-dim);
    line-height: 1.55;
    margin-bottom: 16px;
    flex: 1;
  }

  .service-features {
    list-style: none;
    margin-bottom: 18px;
  }

  .service-features li {
    font-size: 0.85em;
    color: var(--text-dim);
    padding: 5px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .service-features li::before {
    content: '✓';
    color: #fff;
    font-weight: 700;
    font-size: 0.9em;
  }

  .service-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .service-price {
    font-size: 1.2em;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff, #808080);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .service-price small {
    font-size: 0.6em;
    color: var(--text-dim);
    -webkit-text-fill-color: var(--text-dim);
    font-weight: 500;
  }

  .service-btn {
    padding: 9px 18px;
    background: linear-gradient(135deg, #ffffff, #b0b0b0);
    border: none;
    border-radius: 9px;
    color: #000;
    font-weight: 700;
    font-size: 0.82em;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }

  .service-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(255, 255, 255, 0.18);
  }

  /* ===== ПОДВАЛ ===== */
  footer {
    text-align: center;
    padding: 40px 20px;
    border-top: 1px solid var(--border);
    color: #4a4a4a;
    font-size: 0.85em;
    margin-top: 40px;
  }

  footer .wave {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3px;
    height: 20px;
    margin-bottom: 16px;
  }

  footer .wave span {
    width: 3px;
    background: var(--border);
    border-radius: 2px;
    animation: footerWave 1.5s ease-in-out infinite;
  }

  footer .wave span:nth-child(1) { height: 30%; animation-delay: 0s; }
  footer .wave span:nth-child(2) { height: 60%; animation-delay: 0.1s; }
  footer .wave span:nth-child(3) { height: 100%; animation-delay: 0.2s; }
  footer .wave span:nth-child(4) { height: 50%; animation-delay: 0.3s; }
  footer .wave span:nth-child(5) { height: 80%; animation-delay: 0.4s; }
  footer .wave span:nth-child(6) { height: 40%; animation-delay: 0.5s; }
  footer .wave span:nth-child(7) { height: 70%; animation-delay: 0.6s; }
  footer .wave span:nth-child(8) { height: 30%; animation-delay: 0.7s; }
  footer .wave span:nth-child(9) { height: 55%; animation-delay: 0.8s; }

  @keyframes footerWave {
    0%, 100% { transform: scaleY(0.3); }
    50% { transform: scaleY(1); }
  }

  @media (max-width: 640px) {
    nav { padding: 12px 18px; }
    nav ul { display: none; }
    .services { grid-template-columns: 1fr; }
    .main-tabs { flex-direction: column; width: 100%; }
    .main-tab { justify-content: center; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo">
    <img class="logo-img" src="https://i.ibb.co/6RqZz7vK/high-sound.png" alt="High Sound">
    <div class="logo-text">
      <span class="name">High Sound</span>
      <span class="tagline">Auto Sound &amp; Chip Tuning</span>
    </div>
  </div>
  <ul>
    <li><a href="#" data-tab="autosound" class="active">Автозвук</a></li>
    <li><a href="#" data-tab="chiptuning">Чип-тюнинг</a></li>
  </ul>
</nav>

<div class="container">

  <section class="hero">
    <div class="equalizer">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </div>

    <div class="badge">
      <span class="dot"></span>
      Автозвук · Чип-тюнинг
    </div>

    <h1>Всё для вашего <span class="grad">автомобиля</span></h1>
    <span class="hero-sub">Профессиональные услуги по установке автозвука и чип-тюнингу. Качественно, быстро, с гарантией.</span>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Поиск по услугам..." autocomplete="off">
      <button id="searchBtn">Найти</button>
    </div>
  </section>

  <div class="main-tabs">
    <button class="main-tab active" data-panel="autosound">🔊 Автозвук</button>
    <button class="main-tab" data-panel="chiptuning">⚡ Чип-тюнинг</button>
  </div>

  <!-- ===== ПАНЕЛЬ: АВТОЗВУК ===== -->
  <div class="panel active" id="panel-autosound">
    <div class="services" id="services-autosound"></div>
  </div>

  <!-- ===== ПАНЕЛЬ: ЧИП-ТЮНИНГ ===== -->
  <div class="panel" id="panel-chiptuning">
    <div class="services" id="services-chiptuning"></div>
  </div>

</div>

<footer>
  <div class="wave">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>
  © 2024 High Sound · Auto Sound &amp; Chip Tuning
</footer>

<script>
  /* ==================== УСЛУГИ ==================== */
  const services = {
    autosound: [
      {
        icon: '🔊',
        tag: 'Установка',
        title: 'Установка акустической системы',
        desc: 'Профессиональная установка фронтальной и тыловой акустики с правильной фазировкой и шумоизоляцией.',
        features: ['Подбор компонентов', 'Шумоизоляция дверей', 'Правильная фазировка', 'Настройка сцены'],
        price: 'от 8 000 ₽'
      },
      {
        icon: '🔋',
        tag: 'Питание',
        title: 'Установка усилителя и сабвуфера',
        desc: 'Полный монтаж усилителя с прокладкой силовых проводов, установкой предохранителей и сабвуфера в корпус.',
        features: ['Силовая проводка', 'Изготовление короба', 'Настройка усилителя', 'Защита цепи'],
        price: 'от 12 000 ₽'
      },
      {
        icon: '🎧',
        tag: 'Шумоизоляция',
        title: 'Шумоизоляция дверей и салона',
        desc: 'Комплексная шумоизоляция для улучшения баса и снижения посторонних шумов.',
        features: ['Виброизоляция', 'Шумопоглощение', 'Акустическая полка', 'Герметизация'],
        price: 'от 15 000 ₽'
      }
    ],
    chiptuning: [
      {
        icon: '⚡',
        tag: 'Универсальная прошивка',
        title: 'Чип-тюнинг универсальной прошивкой',
        desc: 'Программная оптимизация ЭБУ без доработок железа. Прирост мощности и улучшение отклика.',
        features: ['Оптимизация прошивки под авто', 'Снижение расхода', 'Улучшение отклика', 'Сохранение ресурса'],
        price: 'от 15 000 ₽'
      }
      {
        icon: '📊',
        tag: 'Диагностика',
        title: 'Компьютерная диагностика',
        desc: 'Полная диагностика всех систем автомобиля: двигатель, ABS, SRS, трансмиссия, комфорт.',
        features: ['Чтение ошибок', 'Сброс адаптаций', 'Проверка датчиков', 'Отчёт о состоянии'],
        price: 'от 1 500 ₽'
      }
    ]
  };

  /* ==================== РЕНДЕР УСЛУГ ==================== */
  function renderServices(category) {
    const container = document.getElementById('services-' + category);
    if (!container) return;
    container.innerHTML = '';

    services[category].forEach(s => {
      const card = document.createElement('div');
      card.className = 'service';
      card.innerHTML = `
        <div class="service-head">${s.icon}</div>
        <div class="service-body">
          <span class="service-tag">${s.tag}</span>
          <h3>${s.title}</h3>
          <span class="desc">${s.desc}</span>
          <ul class="service-features">
            ${s.features.map(f => `<li>${f}</li>`).join('')}
          </ul>
          <div class="service-footer">
            <span class="service-price">${s.price}</span>
            <button class="service-btn">Записаться</button>
          </div>
        </div>
      `;
      card.querySelector('.service-btn').addEventListener('click', () => {
        alert('✅ Заявка на услугу «' + s.title + '» отправлена!\n\n(Демо-режим)');
      });
      container.appendChild(card);
    });
  }

  /* ==================== ГЛАВНЫЕ ТАБЫ ==================== */
  document.querySelectorAll('.main-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    });
  });

  document.querySelectorAll('nav a[data-tab]').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const target = link.dataset.tab;
      document.querySelectorAll('nav a[data-tab]').forEach(a => a.classList.remove('active'));
      link.classList.add('active');
      document.querySelectorAll('.main-tab').forEach(t => {
        if (t.dataset.panel === target) t.click();
      });
    });
  });

  /* ==================== ПОИСК ==================== */
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');

  function createServiceCard(s) {
    const card = document.createElement('div');
    card.className = 'service';
    card.innerHTML = `
      <div class="service-head">${s.icon}</div>
      <div class="service-body">
        <span class="service-tag">${s.tag}</span>
        <h3>${s.title}</h3>
        <span class="desc">${s.desc}</span>
        <ul class="service-features">
          ${s.features.map(f => `<li>${f}</li>`).join('')}
        </ul>
        <div class="service-footer">
          <span class="service-price">${s.price}</span>
          <button class="service-btn">Записаться</button>
        </div>
      </div>
    `;
    card.querySelector('.service-btn').addEventListener('click', () => {
      alert('✅ Заявка на услугу «' + s.title + '» отправлена!\n\n(Демо-режим)');
    });
    return card;
  }

  function performSearch() {
    const q = searchInput.value.toLowerCase().trim();
    if (!q) {
      renderServices('autosound');
      renderServices('chiptuning');
      return;
    }
    Object.keys(services).forEach(cat => {
      const container = document.getElementById('services-' + cat);
      container.innerHTML = '';
      services[cat].forEach(s => {
        const text = (s.title + ' ' + s.desc + ' ' + s.tag + ' ' + s.features.join(' ')).toLowerCase();
        if (text.includes(q)) {
          container.appendChild(createServiceCard(s));
        }
      });
    });
  }

  searchInput.addEventListener('input', performSearch);
  searchBtn.addEventListener('click', performSearch);

  /* ==================== ИНИЦИАЛИЗАЦИЯ ==================== */
  renderServices('autosound');
  renderServices('chiptuning');
</script>

</body>
</html>
